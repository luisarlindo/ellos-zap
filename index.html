<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Ellos Zap | Busca &amp; Conexão WhatsApp</title>

  <!-- Google Fonts: Plus Jakarta Sans (exclusiva da Navbar) + Outfit (Tipografia Moderna do App) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png?v=3">

  <!-- PWA Manifest & Mobile / iOS Meta -->
  <link rel="manifest" href="manifest.json?v=3">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ellos Zap">
  <link rel="apple-touch-icon" href="assets/logo.png?v=3">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'xs': '390px'
          },
          fontFamily: {
            sans: ['"Outfit"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            brand: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          colors: {
            ellos: {
              blue: '#0073ce',
              darkBlue: '#005ba3',
              lightBlue: '#ebf5fc',
              red: '#cc292b',
              redHover: '#b52325'
            },
            whatsapp: {
              DEFAULT: '#25D366',
              dark: '#128C7E',
              darker: '#075E54',
              light: '#DCF8C6'
            }
          }
        }
      }
    }
  </script>
  <style>
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top, 0.5rem));
    }
    .safe-bottom {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 1.5rem));
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#f4f7fb] font-sans text-slate-800 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Navbar (Mantém a tipografia original Plus Jakarta Sans no nome Ellos Zap connecTI) -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 safe-top">
    <div class="max-w-xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 font-brand">
        <img 
          src="assets/logo.png?v=3" 
          alt="Ellos Zap" 
          class="w-9 h-9 sm:w-10 sm:h-10 object-contain rounded-full bg-white ring-1 ring-slate-200/90 shadow-2xs shrink-0"
        />
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="text-base sm:text-lg font-extrabold tracking-tight leading-none whitespace-nowrap">
              <span class="text-ellos-blue">Ellos</span> <span class="text-whatsapp">Zap</span>
            </span>
            <span class="px-1.5 py-0.5 text-[9px] sm:text-[10px] font-extrabold bg-sky-50 text-ellos-blue border border-sky-200/80 rounded-md uppercase tracking-wider leading-none shrink-0">
              connecTI
            </span>
          </div>
        </div>
      </div>

      <button 
        type="button" 
        id="btnInstallPwa" 
        onclick="installPwa()" 
        class="hidden inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-bold bg-ellos-blue hover:bg-ellos-darkBlue text-white shadow-2xs transition-all active:scale-95 shrink-0"
        title="Instalar aplicativo no celular"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span>Instalar</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal Enxuto -->
  <main class="flex-1 max-w-xl w-full mx-auto px-3.5 sm:px-6 py-5 sm:py-10 safe-bottom flex flex-col justify-start">
    <section class="bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200/80 p-4 sm:p-6 space-y-4">

      <!-- CAMPO ÚNICO: NOME / TELEFONE / CNPJ -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="unifiedInput" class="block text-xs sm:text-sm font-extrabold uppercase tracking-wider text-slate-800">
            NOME / TELEFONE / CNPJ
          </label>
          <span id="correctedBadge" class="hidden text-[11px] font-semibold text-ellos-blue bg-sky-50 px-2 py-0.5 rounded-md border border-sky-200/70"></span>
        </div>

        <div class="relative flex items-center">
          <input 
            type="text" 
            id="unifiedInput" 
            onkeydown="handleUnifiedKeydown(event)"
            class="block w-full pl-4 pr-16 py-3.5 rounded-xl border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-ellos-blue focus:border-ellos-blue transition-all font-semibold text-base sm:text-lg tabular-nums"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />

          <!-- Spinner de Busca -->
          <div id="searchSpinner" class="hidden absolute right-10 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-ellos-blue animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </div>

          <!-- Botão Limpar -->
          <button
            type="button"
            id="btnClearInput"
            onclick="clearAll()"
            class="hidden absolute right-3 p-1 text-slate-400 hover:text-slate-600 transition-colors"
            title="Limpar"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>

        <!-- Texto de Status: WhatsApp encontrado (verde) ou vermelho se inválido -->
        <div id="whatsappStatusText" class="hidden mt-2 text-xs font-semibold flex items-center gap-1.5 fade-in"></div>
      </div>

      <!-- LISTA DE RESULTADOS / FILIAIS (Nome, Endereço, Telefone Verde/Vermelho) -->
      <div id="resultsContainer" class="hidden space-y-2.5 max-h-[60vh] overflow-y-auto pr-0.5 fade-in"></div>

      <!-- BOTÃO DO WHATSAPP (Branco quando inativo/sem WhatsApp · Verde quando WhatsApp válido) -->
      <div class="pt-1">
        <button 
          type="button" 
          id="btnWhatsAppBar"
          onclick="openSelectedWhatsApp()"
          disabled
          class="w-full py-4 px-5 rounded-xl font-bold text-base flex items-center justify-center gap-2.5 transition-all border-2 bg-white text-slate-400 border-slate-200 cursor-not-allowed"
        >
          <svg class="w-6 h-6 fill-current shrink-0" viewBox="0 0 24 24">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.54 1.861.859 2.796.859 3.179 0 5.767-2.587 5.767-5.766.001-3.182-2.585-5.746-5.767-5.746zm3.377 8.21c-.144.405-.837.774-1.17.824-.312.045-.634.053-1.042-.072-.258-.079-.589-.204-1.002-.381-1.748-.755-2.883-2.525-2.97-2.642-.088-.117-.714-.951-.714-1.815 0-.865.452-1.291.614-1.468.161-.177.352-.221.469-.221.118 0 .235.001.338.006.107.005.25-.041.391.298.147.353.5 1.222.544 1.31.044.089.073.192.015.309-.059.118-.088.192-.176.294-.088.103-.186.23-.265.309-.089.088-.181.185-.078.362.103.176.457.755.981 1.222.674.601 1.242.788 1.419.876.177.088.279.073.382-.044.103-.118.441-.515.559-.691.118-.177.236-.147.397-.089.162.059 1.029.485 1.206.574.177.088.294.132.338.206.044.074.044.426-.1 1.831z"/>
          </svg>
          <span id="btnWhatsAppLabel">WhatsApp</span>
        </button>
      </div>

    </section>
  </main>

  <script>
    const WHATSAPP_SVG = `<svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.54 1.861.859 2.796.859 3.179 0 5.767-2.587 5.767-5.766.001-3.182-2.585-5.746-5.767-5.746zm3.377 8.21c-.144.405-.837.774-1.17.824-.312.045-.634.053-1.042-.072-.258-.079-.589-.204-1.002-.381-1.748-.755-2.883-2.525-2.97-2.642-.088-.117-.714-.951-.714-1.815 0-.865.452-1.291.614-1.468.161-.177.352-.221.469-.221.118 0 .235.001.338.006.107.005.25-.041.391.298.147.353.5 1.222.544 1.31.044.089.073.192.015.309-.059.118-.088.192-.176.294-.088.103-.186.23-.265.309-.089.088-.181.185-.078.362.103.176.457.755.981 1.222.674.601 1.242.788 1.419.876.177.088.279.073.382-.044.103-.118.441-.515.559-.691.118-.177.236-.147.397-.089.162.059 1.029.485 1.206.574.177.088.294.132.338.206.044.074.044.426-.1 1.831z"/></svg>`;

    const VALID_DDDS = new Set([
      11,12,13,14,15,16,17,18,19,21,22,24,27,28,31,32,33,34,35,37,38,
      41,42,43,44,45,46,47,48,49,51,53,54,55,61,62,63,64,65,66,67,68,69,
      71,73,74,75,77,79,81,82,83,84,85,86,87,88,89,91,92,93,94,95,96,97,98,99
    ]);

    const phoneValidationCache = new Map();
    let searchDebounceTimer = null;
    let currentSearchId = 0;
    let currentBranches = [];
    let selectedBranchIdx = 0;
    let selectedPhoneIdx = 0;

    document.addEventListener('DOMContentLoaded', () => {
      const inp = document.getElementById('unifiedInput');
      inp.addEventListener('input', () => handleInput(inp));
    });

    function handleUnifiedKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        clearTimeout(searchDebounceTimer);
        triggerUnifiedSearch(true);
      }
    }

    // Formata apenas se o usuário estiver digitando exclusivamente números/pontuação de telefone ou CNPJ
    function formatNumericMask(digits) {
      const d = digits.replace(/\D/g, '').substring(0, 14);
      if (d.length <= 11) {
        if (d.length > 6) {
          if (d.length === 11) {
            return `(${d.substring(0,2)}) ${d.substring(2,7)}-${d.substring(7)}`;
          }
          return `(${d.substring(0,2)}) ${d.substring(2,6)}-${d.substring(6)}`;
        } else if (d.length > 2) {
          return `(${d.substring(0,2)}) ${d.substring(2)}`;
        } else if (d.length > 0) {
          return `(${d}`;
        }
        return '';
      } else {
        if (d.length > 12) {
          return `${d.substring(0,2)}.${d.substring(2,5)}.${d.substring(5,8)}/${d.substring(8,12)}-${d.substring(12,14)}`;
        }
        return `${d.substring(0,2)}.${d.substring(2,5)}.${d.substring(5,8)}/${d.substring(8)}`;
      }
    }

    function handleInput(input) {
      const raw = input.value;
      const btnClear = document.getElementById('btnClearInput');
      const correctedBadge = document.getElementById('correctedBadge');
      if (correctedBadge) correctedBadge.classList.add('hidden');

      if (raw.trim().length > 0) {
        btnClear.classList.remove('hidden');
      } else {
        btnClear.classList.add('hidden');
        clearResultsUI();
        return;
      }

      const hasLetters = /[a-zA-ZÀ-ÿ]/.test(raw);
      clearTimeout(searchDebounceTimer);

      if (!hasLetters) {
        // Modo numérico (Telefone ou CNPJ)
        const digits = raw.replace(/\D/g, '').substring(0, 14);
        if (digits.length > 0) {
          input.value = formatNumericMask(digits);
        } else {
          input.value = '';
          clearResultsUI();
          return;
        }

        if (digits.length === 14) {
          // CNPJ completo: dispara imediatamente
          triggerUnifiedSearch(false);
        } else if (digits.length >= 10 && digits.length <= 11) {
          // Telefone completo (10 ou 11 dígitos)
          searchDebounceTimer = setTimeout(() => {
            triggerUnifiedSearch(false);
          }, 300);
        } else {
          clearResultsUI();
        }
      } else {
        // Modo Nome (ex: "Pizza Mestre" ou "Pizza Mestro")
        const trimmed = raw.trim();
        if (trimmed.length >= 3) {
          searchDebounceTimer = setTimeout(() => {
            triggerUnifiedSearch(false);
          }, 480);
        } else {
          clearResultsUI();
        }
      }
    }

    function clearAll() {
      const inp = document.getElementById('unifiedInput');
      const btnClear = document.getElementById('btnClearInput');
      const correctedBadge = document.getElementById('correctedBadge');
      clearTimeout(searchDebounceTimer);
      currentSearchId++;
      inp.value = '';
      btnClear.classList.add('hidden');
      if (correctedBadge) correctedBadge.classList.add('hidden');
      clearResultsUI();
      inp.focus();
    }

    function clearResultsUI() {
      currentBranches = [];
      selectedBranchIdx = 0;
      selectedPhoneIdx = 0;
      const container = document.getElementById('resultsContainer');
      const statusText = document.getElementById('whatsappStatusText');
      const spinner = document.getElementById('searchSpinner');
      if (container) {
        container.classList.add('hidden');
        container.innerHTML = '';
      }
      if (statusText) {
        statusText.className = 'hidden';
        statusText.innerHTML = '';
      }
      if (spinner) spinner.classList.add('hidden');
      updateWhatsAppBarState();
    }

    // Valida se um número (10 ou 11 dígitos) tem WhatsApp válido
    async function checkPhoneValidity(cleanDigits) {
      const d = (cleanDigits || '').replace(/\D/g, '');
      if (d.length < 10 || d.length > 11) return false;
      if (phoneValidationCache.has(d)) return phoneValidationCache.get(d);

      const ddd = parseInt(d.substring(0, 2), 10);
      if (!VALID_DDDS.has(ddd)) {
        phoneValidationCache.set(d, false);
        return false;
      }

      const isMobileStructure = (d.length === 11 && d[2] === '9');

      try {
        const res = await fetch(`/api/2chat/check?phone=${d}`);
        if (res.ok) {
          const data = await res.json();
          if (data.on_whatsapp === true || data.exists === true) {
            phoneValidationCache.set(d, true);
            return true;
          }
          if (data.on_whatsapp === false || data.exists === false) {
            phoneValidationCache.set(d, false);
            return false;
          }
        }
      } catch (e) {}

      // Fallback estrutural ANATEL/WhatsApp: celular (11 dígitos com 9) = verde (válido); fixo (10 dígitos) = vermelho
      phoneValidationCache.set(d, isMobileStructure);
      return isMobileStructure;
    }

    async function triggerUnifiedSearch(replaceInputOnCorrection = false) {
      const inp = document.getElementById('unifiedInput');
      const rawQuery = inp.value.trim();
      if (!rawQuery) return;

      const searchId = ++currentSearchId;
      const spinner = document.getElementById('searchSpinner');
      const correctedBadge = document.getElementById('correctedBadge');
      if (spinner) spinner.classList.remove('hidden');

      try {
        const res = await fetch(`/api/2chat/search?q=${encodeURIComponent(rawQuery)}`);
        const data = await res.json();
        if (searchId !== currentSearchId) return;

        if (!res.ok || data.error || !Array.isArray(data.branches) || data.branches.length === 0) {
          currentBranches = [];
          renderBranchesList();
          updateStatusAndBar();
          return;
        }

        // Se foi busca por nome e o Google corrigiu a grafia (ex: "Pizza Mestro" -> "Pizza Mestre")
        if (data.mode === 'name' && data.was_corrected && data.resolved_name) {
          if (correctedBadge) {
            correctedBadge.textContent = `Corrigido: ${data.resolved_name}`;
            correctedBadge.classList.remove('hidden');
          }
          if (replaceInputOnCorrection) {
            inp.value = data.resolved_name;
          }
        } else if (correctedBadge) {
          correctedBadge.classList.add('hidden');
        }

        // Valida os telefones de cada filial retornada
        const validatedBranches = await Promise.all(data.branches.map(async (b) => {
          const rawPhones = Array.isArray(b.phones) ? b.phones : [];
          const phones = await Promise.all(rawPhones.map(async (p) => {
            const cleanP = (p.phone || '').replace(/\D/g, '');
            const isValid = await checkPhoneValidity(cleanP);
            return {
              ...p,
              phone: cleanP,
              formatted: p.formatted || formatNumericMask(cleanP),
              isWhatsAppValid: isValid
            };
          }));

          // Ordena celulares com WhatsApp válido (verdes) primeiro
          phones.sort((x, y) => (y.isWhatsAppValid ? 1 : 0) - (x.isWhatsAppValid ? 1 : 0));

          return {
            name: b.name || data.resolved_name || 'Empresa',
            cnpj: b.cnpj || null,
            address: b.address || '',
            status: b.status || null,
            maps_url: b.maps_url || null,
            phones
          };
        }));

        if (searchId !== currentSearchId) return;
        currentBranches = validatedBranches;

        // Seleciona automaticamente a primeira filial que tenha WhatsApp válido (ou a primeira da lista)
        selectedBranchIdx = 0;
        selectedPhoneIdx = 0;
        for (let i = 0; i < currentBranches.length; i++) {
          const validPIdx = currentBranches[i].phones.findIndex(p => p.isWhatsAppValid);
          if (validPIdx !== -1) {
            selectedBranchIdx = i;
            selectedPhoneIdx = validPIdx;
            break;
          }
        }

        renderBranchesList();
        updateStatusAndBar();
      } catch (err) {
        if (searchId !== currentSearchId) return;
        currentBranches = [];
        renderBranchesList();
        updateStatusAndBar();
      } finally {
        if (searchId === currentSearchId && spinner) {
          spinner.classList.add('hidden');
        }
      }
    }

    function selectBranchPhone(bIdx, pIdx) {
      if (!currentBranches[bIdx]) return;
      selectedBranchIdx = bIdx;
      selectedPhoneIdx = pIdx;
      renderBranchesList();
      updateStatusAndBar();
    }

    function renderBranchesList() {
      const container = document.getElementById('resultsContainer');
      if (!container) return;

      if (!currentBranches || currentBranches.length === 0) {
        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="rounded-xl bg-rose-50/60 border border-rose-200/80 p-3.5 text-center text-xs font-semibold text-rose-600">
            Nenhum resultado encontrado.
          </div>
        `;
        return;
      }

      container.classList.remove('hidden');
      container.innerHTML = currentBranches.map((branch, bIdx) => {
        const isBranchSelected = (bIdx === selectedBranchIdx);
        const cardBorder = isBranchSelected
          ? 'border-ellos-blue/60 bg-sky-50/25 ring-1 ring-ellos-blue/20'
          : 'border-slate-200/90 bg-slate-50/70 hover:bg-slate-50';

        const cnpjHtml = branch.cnpj
          ? `<span class="text-[11px] font-semibold text-slate-500 tabular-nums">CNPJ: ${branch.cnpj}</span>`
          : '';

        const addressHtml = branch.address
          ? `
            <div class="flex items-start justify-between gap-2 text-xs text-slate-600 leading-snug">
              <span>${branch.address}</span>
              ${branch.maps_url ? `
                <a href="${branch.maps_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="shrink-0 text-[11px] font-bold text-ellos-blue hover:underline">
                  📍 Rota
                </a>
              ` : ''}
            </div>
          `
          : '';

        let phonesHtml = '';
        if (branch.phones && branch.phones.length > 0) {
          phonesHtml = branch.phones.map((p, pIdx) => {
            const isSelected = (bIdx === selectedBranchIdx && pIdx === selectedPhoneIdx);
            if (p.isWhatsAppValid) {
              // VERDE com ícone do WhatsApp ao lado (estático)
              const cls = isSelected
                ? 'bg-emerald-600 text-white border-emerald-600 ring-2 ring-emerald-300 shadow-2xs'
                : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border-emerald-300';
              return `
                <button
                  type="button"
                  onclick="event.stopPropagation(); selectBranchPhone(${bIdx}, ${pIdx})"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border transition-all tabular-nums ${cls}"
                >
                  <span>${p.formatted}</span>
                  ${WHATSAPP_SVG}
                </button>
              `;
            } else {
              // VERMELHO sem ícone do WhatsApp
              const cls = isSelected
                ? 'bg-rose-600 text-white border-rose-600 ring-2 ring-rose-300 shadow-2xs'
                : 'bg-rose-50 hover:bg-rose-100 text-rose-600 border-rose-300';
              return `
                <button
                  type="button"
                  onclick="event.stopPropagation(); selectBranchPhone(${bIdx}, ${pIdx})"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border transition-all tabular-nums ${cls}"
                >
                  <span>${p.formatted}</span>
                </button>
              `;
            }
          }).join('');
        } else {
          phonesHtml = `<span class="text-xs font-semibold text-rose-600">Sem telefone cadastrado</span>`;
        }

        return `
          <div 
            onclick="selectBranchPhone(${bIdx}, 0)"
            class="rounded-xl border p-3.5 transition-all cursor-pointer space-y-2 ${cardBorder}"
          >
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <h2 class="text-sm sm:text-base font-bold text-slate-900 leading-tight">${branch.name}</h2>
              ${cnpjHtml}
            </div>
            ${addressHtml}
            <div class="flex flex-wrap items-center gap-2 pt-1">
              ${phonesHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStatusAndBar() {
      const statusText = document.getElementById('whatsappStatusText');
      let anyValid = false;
      let totalValid = 0;

      for (const b of currentBranches) {
        for (const p of (b.phones || [])) {
          if (p.isWhatsAppValid) {
            anyValid = true;
            totalValid++;
          }
        }
      }

      if (statusText) {
        if (currentBranches.length === 0) {
          statusText.className = "mt-2 text-xs font-semibold text-rose-600 flex items-center gap-1.5 fade-in";
          statusText.innerHTML = `<span>WhatsApp não encontrado</span>`;
        } else if (anyValid) {
          statusText.className = "mt-2 text-xs font-semibold text-emerald-600 flex items-center gap-1.5 fade-in";
          const msg = totalValid > 1
            ? 'WhatsApp encontrado · Os números com WhatsApp ficam na cor verde'
            : 'WhatsApp encontrado · O número com WhatsApp fica na cor verde';
          statusText.innerHTML = `${WHATSAPP_SVG} <span>${msg}</span>`;
        } else {
          statusText.className = "mt-2 text-xs font-semibold text-rose-600 flex items-center gap-1.5 fade-in";
          statusText.innerHTML = `<span>WhatsApp não encontrado</span>`;
        }
      }

      updateWhatsAppBarState();
    }

    function updateWhatsAppBarState() {
      const btn = document.getElementById('btnWhatsAppBar');
      const label = document.getElementById('btnWhatsAppLabel');
      if (!btn || !label) return;

      const selectedBranch = currentBranches[selectedBranchIdx] || null;
      const selectedPhone = selectedBranch && selectedBranch.phones ? selectedBranch.phones[selectedPhoneIdx] : null;

      if (selectedBranch && selectedPhone && selectedPhone.isWhatsAppValid) {
        // Botão VERDE ativo
        btn.disabled = false;
        btn.className = "w-full py-4 px-5 rounded-xl font-bold text-base sm:text-lg flex items-center justify-center gap-2.5 transition-all border-2 bg-[#25D366] hover:bg-[#1ebe5d] active:scale-[0.98] text-white border-[#25D366] shadow-lg shadow-emerald-500/25 cursor-pointer";
        label.textContent = selectedBranch.name && selectedBranch.name !== selectedPhone.formatted
          ? `WhatsApp · ${selectedBranch.name}`
          : `WhatsApp · ${selectedPhone.formatted}`;
      } else {
        // Barra BRANCA inativa
        btn.disabled = true;
        btn.className = "w-full py-4 px-5 rounded-xl font-bold text-base flex items-center justify-center gap-2.5 transition-all border-2 bg-white text-slate-400 border-slate-200 cursor-not-allowed";
        label.textContent = "WhatsApp";
      }
    }

    function openSelectedWhatsApp() {
      const selectedBranch = currentBranches[selectedBranchIdx] || null;
      const selectedPhone = selectedBranch && selectedBranch.phones ? selectedBranch.phones[selectedPhoneIdx] : null;
      if (!selectedBranch || !selectedPhone || !selectedPhone.isWhatsAppValid) return;

      const cleanPhone = selectedPhone.phone.replace(/\D/g, '');
      const hasCustomName = selectedBranch.name && selectedBranch.name !== selectedPhone.formatted;
      const text = hasCustomName
        ? `Olá ${selectedBranch.name}, tudo bem?`
        : `Olá, tudo bem?`;

      const encodedText = encodeURIComponent(text);
      // Abre diretamente o aplicativo nativo do WhatsApp na conversa (sem passar pela tela intermediária do site api.whatsapp.com)
      const deepLink = `whatsapp://send?phone=55${cleanPhone}&text=${encodedText}`;
      window.location.href = deepLink;
    }

    // ==========================================
    // PWA & Service Worker
    // ==========================================
    let deferredInstallPrompt = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=13').then((reg) => {
          reg.update();
        }).catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('btnInstallPwa');
      if (btn) btn.classList.remove('hidden');
    });

    async function installPwa() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      const btn = document.getElementById('btnInstallPwa');
      if (btn) btn.classList.add('hidden');
    }

    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('btnInstallPwa');
      if (btn) btn.classList.add('hidden');
    });
  </script>
</body>
</html>
